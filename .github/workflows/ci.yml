name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  # ─── Core tests (always run) ───
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest tests/ -v --tb=short

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
      # Pinned on purpose: the job installed whatever ruff was newest, so the
      # lint rules changed under the repo without a commit. 0.16 widened the
      # default rule set and CI went from clean to 476 errors overnight on
      # code nobody had touched, while pre-commit (language: system) kept
      # using the locally installed ruff and stayed green. Bump deliberately,
      # together with the fixes the new rules ask for.
      - run: pip install ruff==0.15.8
      - run: ruff check src/ tests/
      - run: ruff format --check src/ tests/

  # Per-country smoke testing used to live here as two more jobs
  # (detect-countries + country-smoke): a substring glob (`test_*$country*`)
  # that matched the wrong files for fr/ar/se, two unreachable elif branches,
  # and an `else` that let a brand-new fetcher with zero tests read as
  # passing. It was also redundant with `test` above: test_pipeline_generic.py
  # already iterates all 33 countries' dispatch on every push (the same
  # assertion "Verify dispatch" ran per-country here), and pytest already
  # collects every tests/test_*.py file — including country-specific ones —
  # without a glob to get subtly wrong. Removed rather than fixed; per-country
  # test discoverability is a file-naming convention (tests/test_*_{cc}*.py),
  # not a CI job.
