name: Monthly update (Cuba)

# The Gaceta Oficial catalog ("Algunas legislaciones cubanas") refreshes
# irregularly — frequently within a month but not daily. This workflow runs
# on the 1st at 12:00 UTC and replays the full CU bootstrap against the
# luilver/legalize-cu repository. The engine's idempotency layer skips
# commits that already exist, so re-running is safe and fast for unchanged
# norms. New legislation reaches the pipeline by updating manifest.json (the
# URL map) in the legalize-cu repo; bootstrap reads it via manifest_url.
#
# Unlike the daily-update workflow, CU is NOT on the matrix: the catalog is
# not a daily feed. The production repo lives under the personal account
# (luilver/legalize-cu), so the Legalize GitHub App must be installed on
# that account and granted access to legalize-cu for this token to mint.

on:
  schedule:
    - cron: "0 12 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 480  # 8h ceiling — actual run is a few minutes
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        id: app-token
        with:
          app-id: ${{ secrets.LEGALIZE_APP_ID }}
          private-key: ${{ secrets.LEGALIZE_APP_PRIVATE_KEY }}
          owner: luilver
          repositories: legalize-cu

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: luilver/legalize-cu
          path: repos/cu
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e .

      - name: Configure git identity
        working-directory: repos/cu
        run: |
          git config user.name "Legalize"
          git config user.email "legalize@legalize.dev"

      - name: Run CU bootstrap (idempotent — existing commits are skipped)
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          legalize bootstrap -c cu --repo-path repos/cu --data-dir data-cu

      - name: Push updates
        working-directory: repos/cu
        run: |
          if git diff --quiet HEAD origin/main; then
            echo "No new commits to push."
          else
            git push origin HEAD:main
          fi
