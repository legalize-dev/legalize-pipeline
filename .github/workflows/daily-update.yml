name: Daily update

on:
  schedule:
    # Mon-Sat at 10:00 UTC
    - cron: "0 10 * * 1-6"
  workflow_dispatch:
    inputs:
      country:
        description: "Country code (es, fr, at, de, se, pt, lv, ad, lt, ee, pl, gr, nl, be, cz, fi, it, lu, eu, uk)"
        required: false
        type: string
        default: ""
      date:
        description: "Date to process (YYYY-MM-DD), empty = automatic"
        required: false
        type: string

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    # The GitHub App token minted at job start lives ~1h, and pushes are the
    # only durable output — anything processed after it expires is wasted work
    # that can never be pushed. Cap the job just under the token lifetime so a
    # slow country (e.g. nl catching up a large backlog) stops instead of
    # burning hours it can't commit. Per-day checkpoint pushes (see
    # pipeline.generic_daily) persist whatever completed within the window, and
    # the next run resumes from there. Fast countries finish in minutes.
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        # Countries excluded from the daily run:
        #   uy: paused — IMPO source only exposes up to 1941 in the current
        #       fetcher, so the daily always clamps to the last 10 days and
        #       finds nothing. Re-enable once a modern reform source lands.
        #   ro: bootstrap only, not yet wired for daily updates.
        country: ${{ fromJson(inputs.country && format('["{0}"]', inputs.country) || '["es","fr","at","de","se","pt","lv","ad","lt","ee","pl","gr","nl","be","cz","fi","it","lu","eu","uk"]') }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3
        id: app-token
        with:
          app-id: ${{ secrets.LEGALIZE_APP_ID }}
          private-key: ${{ secrets.LEGALIZE_APP_PRIVATE_KEY }}
          owner: legalize-dev
          repositories: legalize-${{ matrix.country }}

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: legalize-dev/legalize-${{ matrix.country }}
          path: repos/${{ matrix.country }}
          token: ${{ steps.app-token.outputs.token }}
          # Treeless partial clone with a root-only working tree. Measured on
          # legalize-pt (302,335 commits, 171,722 files) against the real remote:
          #
          #   blob:none + full checkout   52 min   ← what this used to do
          #   blob:none, no checkout       3 min   ← the history and its trees
          #   tree:0,   no checkout         39 s   ← the history alone
          #
          # So the working tree was 48 of those 52 minutes, against a job budget
          # of 55 and a pipeline that runs in seconds. The daily touches a handful
          # of files, so it does not need the other 171,721 on disk: the committer
          # opens each directory it writes to (`git sparse-checkout add`, ~6 s for
          # a year of Portugal). What stays local and instant is the commit graph,
          # which is what the run actually reads — `git log --grep=Source-Date` to
          # resume, and the Source-Id/Norm-Id trailers to skip what is already
          # published: 3.1 s over the whole history of Portugal.
          fetch-depth: 0
          filter: tree:0
          sparse-checkout: .github
          sparse-checkout-cone-mode: true

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e .

      - name: Run daily pipeline
        env:
          INPUT_DATE: ${{ inputs.date }}
          INPUT_COUNTRY: ${{ matrix.country }}
        run: |
          DATE_FLAG=""
          if [ -n "$INPUT_DATE" ]; then
            DATE_FLAG="--date $INPUT_DATE"
          fi
          legalize daily -c "$INPUT_COUNTRY" --repo-path "repos/$INPUT_COUNTRY" $DATE_FLAG --push
