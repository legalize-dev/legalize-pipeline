name: Monthly update (Argentina)

# Argentina's InfoLEG catalog refreshes on the 1st of each month. This
# workflow runs on the 2nd at 12:00 UTC (to give SAIJ a few hours of slack)
# and replays the full AR bootstrap. The engine's idempotency layer skips
# commits that already exist, so re-running is safe and fast for unchanged
# norms.
#
# Unlike the daily-update workflow, AR is NOT on the matrix: the InfoLEG
# catalog is published monthly, daily runs would be a pure no-op (enforced
# by `_SKIP_WEEKDAYS["ar"] = {0..6}` in pipeline.py).

on:
  schedule:
    - cron: "0 12 2 * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Force full re-bootstrap (ignore idempotency cache)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    # The GitHub App installation token minted below is only valid for ~1h —
    # a GitHub-enforced ceiling, not something create-github-app-token can
    # extend (same rule documented in daily-update.yml). The full AR bootstrap
    # takes ~4-6h, so a job-level timeout anywhere near that (this used to be
    # 480 = 8h) just means the run gets cancelled with a dead token and the
    # "Push updates" step — guarded by if: always() below, plus its own fresh
    # token — never got a chance to publish whatever *was* committed locally.
    # None of the last 4 months' runs ever reached Push. Capping well under
    # the token's 1h lifetime, combined with the idempotency layer (existing
    # commits are skipped fast), makes each run salvage its partial progress
    # and the next month's run continue from there — same pattern as the
    # daily matrix's 55m cap.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        id: app-token
        with:
          app-id: ${{ secrets.LEGALIZE_APP_ID }}
          private-key: ${{ secrets.LEGALIZE_APP_PRIVATE_KEY }}
          owner: legalize-dev
          repositories: legalize-ar

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: legalize-dev/legalize-ar
          path: repos/ar
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e .

      - name: Configure git identity
        working-directory: repos/ar
        run: |
          git config user.name "Legalize"
          git config user.email "legalize@legalize.dev"

      - name: Run AR bootstrap (idempotent — existing commits are skipped)
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          legalize bootstrap -c ar --repo-path repos/ar --data-dir data-ar

      # Minted right before the push instead of reused from job start: by now
      # up to ~50 minutes have elapsed and the original token may be close to
      # (or past) its 1h expiry. if: always() so a cancelled bootstrap above
      # (job timeout) still gets whatever it managed to commit locally pushed.
      - name: Refresh GitHub App token before push
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        id: app-token-push
        if: always()
        with:
          app-id: ${{ secrets.LEGALIZE_APP_ID }}
          private-key: ${{ secrets.LEGALIZE_APP_PRIVATE_KEY }}
          owner: legalize-dev
          repositories: legalize-ar

      - name: Push updates
        if: always()
        working-directory: repos/ar
        env:
          PUSH_TOKEN: ${{ steps.app-token-push.outputs.token }}
        run: |
          if git diff --quiet HEAD origin/main 2>/dev/null; then
            echo "No new commits to push."
          else
            git push "https://x-access-token:${PUSH_TOKEN}@github.com/legalize-dev/legalize-ar.git" HEAD:main
          fi
