[project]
name = "legalize"
version = "0.1.0"
description = "Multi-country pipeline that converts official legislation into version-controlled Markdown in Git"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "lxml>=5.0",
    "requests>=2.31",
    "pyyaml>=6.0",
    "click>=8.1",
    "rich>=13.0",
    "pdfplumber>=0.11",  # Estonia: PDF annex → Markdown table conversion
    "pypdfium2>=4.30",  # Greece: column-aware PDF text extraction (BSD-3-Clause)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-snapshot",
    "responses>=0.25",
    # Pinned, not >=: ruff's default lint rule set changes between minor
    # versions. 0.16 widened it and turned a clean tree into 503 errors
    # overnight for anyone who ran `pip install -e ".[dev]"` per
    # CONTRIBUTING.md. Keep this in sync with the ruff version ci.yml
    # installs explicitly (see the comment there).
    "ruff==0.15.8",
]

[project.scripts]
legalize = "legalize.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/legalize"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# Explicit rather than "whatever this version's default is" (see the ruff==
# pin above). E4/E7/E9/F is ruff's own default select; B (flake8-bugbear) is
# added on top — it catches real bugs, two of which it did catch here.
select = ["E4", "E7", "E9", "F", "B"]

# The per-file-ignores that used to sit here (18 B violations across 12 files)
# are gone: the backlog was cleared, not re-fenced. Two of them were real —
# a `_valid` closure in be/client.py that read the loop variable late, and a
# `raise` in lu/client.py that dropped the download error, which is what turns
# a failed fetch into "this law has no XML". Keep this file free of ignores.

[dependency-groups]
dev = [
    "cssselect>=1.4.0",
]
