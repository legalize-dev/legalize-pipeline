[project]
name = "legalize"
version = "0.1.0"
description = "Multi-country pipeline that converts official legislation into version-controlled Markdown in Git"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "lxml>=5.0",
    "requests>=2.31",
    "pyyaml>=6.0",
    "click>=8.1",
    "rich>=13.0",
    "pdfplumber>=0.11",  # Estonia: PDF annex → Markdown table conversion
    "pypdfium2>=4.30",  # Greece: column-aware PDF text extraction (BSD-3-Clause)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-snapshot",
    "responses>=0.25",
    # Pinned, not >=: ruff's default lint rule set changes between minor
    # versions. 0.16 widened it and turned a clean tree into 503 errors
    # overnight for anyone who ran `pip install -e ".[dev]"` per
    # CONTRIBUTING.md. Keep this in sync with the ruff version ci.yml
    # installs explicitly (see the comment there).
    "ruff==0.15.8",
]

[project.scripts]
legalize = "legalize.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/legalize"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# Explicit rather than "whatever this version's default is" (see the ruff==
# pin above). E4/E7/E9/F is ruff's own default select; B (flake8-bugbear) is
# added on top — it catches real bugs (see per-file-ignores below for the
# pre-existing debt it found on first run).
select = ["E4", "E7", "E9", "F", "B"]

# Pre-existing B violations as of enabling the rule, fenced off per file so
# new code (and new files) are held to it while this backlog gets cleared.
# TODO(fetcher owner): fix in src/legalize/fetcher/** and drop the ignore —
# not engine CI's scope, see the CI/alerting review, finding 7.
[tool.ruff.lint.per-file-ignores]
"src/legalize/cli.py" = ["B007"]
"src/legalize/fetcher/_tables.py" = ["B007"]
"src/legalize/fetcher/base.py" = ["B027"]
"src/legalize/fetcher/be/client.py" = ["B023"]
"src/legalize/fetcher/be/parser.py" = ["B905"]
"src/legalize/fetcher/ee/discovery.py" = ["B007"]
"src/legalize/fetcher/gr/pdf_extractor.py" = ["B007"]
"src/legalize/fetcher/ie/parser.py" = ["B007"]
"src/legalize/fetcher/lu/client.py" = ["B904"]
"src/legalize/fetcher/ro/parser.py" = ["B007"]
# Same backlog, in tests/ — out of this task's file scope (only
# tests/test_repo_meta_license.py), left for whoever owns those tests.
"tests/test_integration_multicountry.py" = ["B905"]
"tests/test_layout.py" = ["B007"]

[dependency-groups]
dev = [
    "cssselect>=1.4.0",
]
